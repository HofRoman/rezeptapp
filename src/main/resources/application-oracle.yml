spring:
  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:db}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none     # <-- Schema NICHT von Hibernate, wir nutzen schema.sql
    show-sql: true

  sql:
    init:
      mode: always
      continue-on-error: true   # <-- DROP-Fehler (wenn Tabelle fehlt) ignorieren
